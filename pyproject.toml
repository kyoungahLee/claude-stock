[project]
name = "stock-forecast-platform"
version = "0.1.0"
description = "Daily stock forecast platform with ML + LLM hybrid analysis"
requires-python = ">=3.10"
dependencies = [
    # Core
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    # Data
    "yfinance>=0.2.30",
    "pandas>=2.0",
    "numpy>=1.24",
    "feedparser>=6.0",
    "beautifulsoup4>=4.12",
    "httpx>=0.24",
    # Technical Analysis
    "ta>=0.10",
    # ML
    "xgboost>=2.0",
    "scikit-learn>=1.3",
    # LLM
    "anthropic>=0.30",
    # Database
    "sqlalchemy>=2.0",
    "aiosqlite>=0.19",
    # Scheduler
    "apscheduler>=3.10",
    # Notifications
    "slack-sdk>=3.21",
    # Reports
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]
lstm = [
    "torch>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
